name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Java ${{ matrix.java }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [ "17", "21", "25" ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin
          cache: maven

      - name: Compile with -Werror, test and package
        run: mvn -B verify

      - name: Command line smoke test
        run: |
          java -jar target/birth-date.jar 20171016 1000000000 | tee output.txt
          grep -q "Fecha de nacimiento : 6 de febrero de 1986, 22:13:20" output.txt
          printf '20240301\n86400\n' | java -jar target/birth-date.jar | grep -q "29 de febrero de 2024"
          if java -jar target/birth-date.jar 20230229 10; then exit 1; fi
